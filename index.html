<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>محاسبه شارژ ساختمان</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#14213d;--mut:#6b7691;--pri:#2563eb;--pri2:#1d4ed8;--ok:#16a34a;--bad:#dc2626;--line:#e3e8f2;--soft:#eaf1ff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1424;--card:#172036;--tx:#eef2fb;--mut:#9aa6c3;--pri:#4f8cff;--pri2:#3b78ee;--line:#27324d;--soft:#1c2a4a;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:Vazirmatn,Tahoma,system-ui,sans-serif;font-size:18px;line-height:1.7;min-height:100vh}
.app{max-width:520px;margin:0 auto;padding:16px 16px 130px}
.bar{height:8px;background:var(--line);border-radius:8px;overflow:hidden;margin:6px 0 18px}
.bar i{display:block;height:100%;background:var(--pri);border-radius:8px;transition:width .3s}
.step{font-size:15px;color:var(--mut)}
.card{background:var(--card);border-radius:22px;padding:22px;box-shadow:0 4px 20px rgba(20,33,61,.07);margin-bottom:14px}
h1{font-size:28px;margin:0 0 6px;font-weight:800}
p{margin:0 0 12px;color:var(--mut)}
.big{width:100%;font-size:38px;font-weight:800;line-height:1.3;font-family:inherit;text-align:center;padding:16px 10px;border:2px solid var(--line);border-radius:18px;background:var(--bg);color:var(--tx);direction:ltr;outline:none}
.big:focus,.sm:focus,.mid:focus{border-color:var(--pri)}
.unit-lbl{text-align:center;color:var(--mut);margin-top:8px;font-size:16px}
.mid{width:100%;font-size:26px;font-weight:600;font-family:inherit;text-align:center;padding:12px;border:2px solid var(--line);border-radius:14px;background:var(--bg);color:var(--tx);outline:none}
.nav{position:fixed;right:0;left:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;max-width:520px;margin:0 auto}
button{font-family:inherit;border:0;border-radius:16px;font-size:20px;font-weight:600;padding:15px;cursor:pointer}
.b1{background:var(--pri);color:#fff;flex:2}.b1:active{background:var(--pri2)}
.b2{background:var(--soft);color:var(--pri);flex:1}
.b3{background:var(--soft);color:var(--pri);width:100%;margin-top:10px;font-size:18px;padding:12px}
.err{color:var(--bad);font-size:16px;margin-top:10px;min-height:24px;text-align:center}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lbl{font-size:15px;color:var(--mut);margin-bottom:4px;text-align:center}
.sum{display:flex;justify-content:space-around;text-align:center;background:var(--soft);border-radius:16px;padding:10px;margin:12px 0}
.sum b{display:block;font-size:24px}.sum span{font-size:14px;color:var(--mut)}
.urow{display:grid;grid-template-columns:90px 1fr 1fr;gap:10px;align-items:center;margin-bottom:8px}
.urow .n{text-align:center;color:var(--mut);font-weight:600;line-height:1.3}.urow .n small{display:block;font-size:13px;font-weight:400}
.opt{display:block;width:100%;text-align:right;background:var(--bg);color:var(--tx);border:2px solid var(--line);border-radius:18px;padding:16px;margin-top:12px;font-weight:400}.opt.on{border-color:var(--pri);background:var(--soft)}.opt b{font-size:21px;display:block}.opt span{font-size:15px;color:var(--mut)}
.sm{width:100%;font-size:24px;font-weight:600;font-family:inherit;text-align:center;padding:9px 4px;border:2px solid var(--line);border-radius:12px;background:var(--bg);color:var(--tx);outline:none}
.hd{position:sticky;top:0;background:var(--card);padding:4px 0}
textarea{width:100%;min-height:110px;font-size:20px;font-family:inherit;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--tx);padding:10px;direction:ltr}
details summary{cursor:pointer;color:var(--pri);font-weight:600;padding:6px 0}
.total{text-align:center}.total .v{font-size:36px;font-weight:800;color:var(--pri)}
.kv{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border:0}
.list{max-height:360px;overflow-y:auto}
.lrow{display:flex;justify-content:space-between;padding:9px 4px;border-bottom:1px solid var(--line);font-size:17px}
.ib{width:36px;height:36px;border-radius:50%;padding:0;font:italic 700 20px serif;background:var(--soft);color:var(--pri);flex:none}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.mbox{background:var(--card);width:100%;max-width:520px;max-height:88vh;overflow-y:auto;border-radius:24px 24px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px))}
.mt{display:flex;justify-content:space-between;align-items:center}
.mc{width:44px;height:44px;padding:0;border-radius:50%;background:var(--soft);color:var(--pri);font-size:28px;line-height:1}
.mi{padding:12px 0;border-bottom:1px solid var(--line)}
.mh{display:flex;justify-content:space-between;font-size:20px}
.mf{color:var(--pri);font-size:16px;margin:2px 0}
.mx{font-size:15px;color:var(--mut)}
.fb{display:block;width:100%;background:none;border:2px dashed var(--line);color:var(--pri);font-size:18px;padding:14px;margin-top:6px}
.ok{color:var(--ok);font-weight:600;text-align:center}
</style>
</head>
<body>
<div class="app">
  <div class="step" id="stepTxt"></div>
  <div class="bar"><i id="barI"></i></div>
  <div id="main"><div class="card"><h1>در حال بارگذاری…</h1><p>اگر این پیام بیشتر از چند ثانیه می‌ماند، یعنی برنامه‌ی باز کننده‌ی فایل جاوااسکریپت را اجرا نمی‌کند. فایل را با Safari یا Chrome باز کنید.</p></div><noscript><div class="card"><h1>جاوااسکریپت غیرفعال است</h1><p>این برنامه برای کار کردن به جاوااسکریپت نیاز دارد. فایل را در Safari یا Chrome باز کنید.</p></div></noscript></div>
</div>
<div class="nav" id="nav"></div>
<script>
window.onerror=function(m,u,l,c){var e=document.getElementById('main');if(e)e.innerHTML='<div class="card"><h1>خطا</h1><p style="direction:ltr;text-align:left">'+m+' (line '+l+':'+c+')</p><p>این پیام را برای من بفرستید.</p></div>';};
const FA='۰۱۲۳۴۵۶۷۸۹',AR='٠١٢٣٤٥٦٧٨٩';
const norm=s=>String(s).replace(/[۰-۹]/g,d=>FA.indexOf(d)).replace(/[٠-٩]/g,d=>AR.indexOf(d)).replace(/[٫،]/g,'.').replace(/[٬,\s]/g,'');
const num=s=>{const x=parseFloat(norm(s));return isFinite(x)&&x>0?x:0};
const fa=n=>Math.round(n).toLocaleString('fa-IR');
const DEFV={n:0,P:200000000,E:120000000,W:130000000,G:90000000,M:20000000,r:0,em:'a'};
const v=Object.assign({},DEFV);
const BL=['شمالی','جنوبی'];
const DEF="101,0,138,3;102,0,168,4;103,0,129,3;104,0,134,2;105,0,171,3;106,0,171,4;107,0,134,2;108,0,129,5;109,0,168,3;110,0,138,4;201,0,138,4;202,0,113,3;203,0,104,2;204,0,121,2;205,0,131,4;206,0,124,2;207,0,94,4;208,0,94,4;209,0,124,2;210,0,131,3;211,0,121,2;212,0,104,4;213,0,113,3;214,0,138,2;301,0,115,2;302,0,113,5;303,0,160,4;304,0,58,1;305,0,100,6;306,0,120,4;307,0,113,5;308,0,115,4;401,0,115,4;402,0,113,3;403,0,120,3;404,0,100,2;405,0,100,2;406,0,120,1;407,0,113,3;408,0,115,3;501,0,115,3;502,0,113,4;503,0,120,2;504,0,100,3;505,0,100,3;506,0,120,1;507,0,113,2;508,0,115,5;601,0,115,3;602,0,113,3;603,0,120,4;604,0,110,3;605,0,110,2;606,0,120,3;607,0,113,2;608,0,115,4;701,0,115,5;702,0,113,2;703,0,120,4;704,0,100,4;705,0,100,5;706,0,120,3;707,0,113,3;708,0,115,3;801,0,115,4;802,0,113,2;803,0,120,2;804,0,100,4;805,0,100,3;806,0,120,3;807,0,113,3;808,0,115,3;901,0,115,4;902,0,113,3;903,0,120,3;904,0,100,4;905,0,100,3;906,0,120,1;907,0,113,4;908,0,115,5;201,1,138,3;202,1,104,4;203,1,96,2;204,1,104,5;205,1,135,3;206,1,124,3;207,1,91,4;208,1,91,3;209,1,124,4;210,1,135,3;211,1,106,2;212,1,104,4;213,1,113,3;214,1,140,3;301,1,115,3;302,1,113,1;303,1,120,4;304,1,100,5;305,1,100,2;306,1,120,3;307,1,113,2;308,1,115,1;401,1,115,4;402,1,113,3;403,1,120,3;404,1,100,3;405,1,100,2;406,1,120,5;407,1,113,4;408,1,115,2;501,1,115,3;502,1,113,4;503,1,120,2;504,1,100,3;505,1,100,3;506,1,120,2;507,1,113,4;508,1,115,3;601,1,115,5;602,1,113,5;603,1,120,2;604,1,100,4;605,1,100,4;606,1,120,3;607,1,113,3;608,1,115,3;701,1,115,3;702,1,113,3;703,1,120,4;704,1,100,4;705,1,100,1;706,1,120,2;707,1,113,3;708,1,115,2;801,1,115,0;802,1,113,4;803,1,120,3;804,1,100,0;805,1,100,2;806,1,120,4;807,1,113,2;808,1,115,2;901,1,115,3;902,1,113,2;903,1,120,4;904,1,100,0;905,1,100,1;906,1,120,2;907,1,113,3;908,1,115,3;100,1,60,2";
const defUnits=()=>DEF.split(';').map(x=>{const q=x.split(',');return{l:q[0],b:+q[1],a:+q[2],p:+q[3]}});
const pd=x=>String(x).replace(/\d/g,d=>FA[d]);
let units=defUnits();
try{const s=JSON.parse(localStorage.getItem('chargeUnits2')||'null');if(s&&s.length>0)units=s}catch(e){}
v.n=units.length;
const save=()=>{try{localStorage.setItem('chargeUnits2',JSON.stringify(units))}catch(e){}};
const setCount=k=>{while(units.length<k)units.push({a:0,p:0,l:'',b:-1});units.length=k;save()};
const uname=i=>{const u=units[i];return 'واحد '+pd(u.l||i+1)+(u.b>=0?' '+BL[u.b]:'')};
const ulabel=(u,i)=>'<b>'+pd(u.l||i+1)+'</b>'+(u.b>=0?'<small>'+BL[u.b]+'</small>':'');
const steps=[
 {k:'em',t:'روش تقسیم هزینه برق',d:'هزینه برق مشاع چطور بین واحدها تقسیم شود؟ گاز، نگهداری و صندوق همیشه بر اساس متراژ است.',choice:[['a','بر اساس متراژ','واحدهای بزرگ‌تر سهم بیشتری می‌دهند (پیش‌فرض)'],['u','مساوی بین همه واحدها','هر واحد سهم برابر می‌دهد، حتی واحد خالی']]},
 {k:'n',t:'تعداد واحدها',d:'تعداد کل واحدهای ساختمان را وارد کنید (واحدهای خالی هم حساب می‌شوند). بعداً هم می‌توانید عوضش کنید.',u:'واحد'},
 {k:'P',t:'هزینه پرسنل',d:'جمع حقوق و دستمزد نگهبان، سرایدار و نظافتچی این ماه',u:'تومان'},
 {k:'E',t:'برق مشاع',d:'مبلغ قبض برق قسمت‌های مشترک ساختمان',u:'تومان'},
 {k:'W',t:'آب مشاع',d:'مبلغ قبض آب ساختمان. بین ساکنین تقسیم می‌شود.',u:'تومان'},
 {k:'G',t:'گاز',d:'مبلغ قبض گاز ساختمان. بر اساس متراژ تقسیم می‌شود.',u:'تومان'},
 {k:'M',t:'نگهداری و تعمیرات جاری',d:'هزینه آسانسور، پمپ، تأسیسات، تعمیرات و ...',u:'تومان'},
 {k:'r',t:'نرخ صندوق',d:'درصدی از کل هزینه‌ها که برای صندوق ساختمان کنار گذاشته می‌شود.',u:'درصد',pct:1}
];
let s=0;const last=steps.length+1; // units step = steps.length, result = last
const $=id=>document.getElementById(id);

function calc(){
  const n=units.length,A=units.reduce((x,u)=>x+u.a,0),N=units.reduce((x,u)=>x+u.p,0);
  if(n<=0||A<=0)return{err:'مجموع متراژ باید بیشتر از صفر باشد.'};
  if(v.W>0&&N<=0)return{err:'هزینه آب وارد شده ولی هیچ ساکنی ثبت نشده است.'};
  const W=N>0?v.W:0;
  const O=v.P+v.E+W+v.G+v.M,R=v.r/100*O;
  const rows=units.map((u,i)=>{
    const c=v.P/n, e=v.em==='u'?v.E/n:u.a*v.E/A, w=N>0?u.p*W/N:0, g=u.a*v.G/A, m=u.a*v.M/A, f=u.a*R/A;
    return{i,c,e,w,g,m,f,raw:c+e+w+g+m+f,pay:0}});
  rows.forEach(r=>r.pay=Math.round(r.raw));
  const target=Math.round(O+R);
  let big=0;units.forEach((u,i)=>{if(u.a>units[big].a)big=i});
  const adj=target-rows.reduce((x,r)=>x+r.pay,0);
  rows[big].pay+=adj;
  return{rows,O,R,target,n,A,N,adj,big};
}

function render(){
  $('barI').style.width=(s/last*100)+'%';
  $('stepTxt').textContent=s<steps.length?`مرحله ${fa(s+1)} از ${fa(last+1)}`:s===steps.length?`مرحله ${fa(s+1)} از ${fa(last+1)}`:'نتیجه';
  const m=$('main'),nav=$('nav');
  if(s<steps.length){
    const st=steps[s],val=v[st.k];
    m.innerHTML=`<div class="card"><h1>${st.t}</h1><p>${st.d}</p>
    <input class="big" id="inp" inputmode="decimal" placeholder="۰" autocomplete="off" value="${val?(st.pct?fa(val):fa(val)):''}">
    <div class="unit-lbl">${st.u}</div><div class="err" id="err"></div>${st.k==='W'?'<p style="margin-top:12px;font-size:15px">اگر ماه جاری هیچ ساکنی نباشد، آب صفر حساب می‌شود.</p>':''}</div>`;
    const inp=$('inp');
    inp.oninput=()=>{let x=num(inp.value);if(st.k==='n')x=Math.min(1000,Math.floor(x));v[st.k]=x;inp.value=x?(st.pct?norm(inp.value):fa(x)):''};
    if(st.choice){m.innerHTML=`<div class="card"><h1>${st.t}</h1><p>${st.d}</p>${st.choice.map(o=>`<button class="opt${v[st.k]===o[0]?' on':''}" data-v="${o[0]}"><b>${o[1]}</b><span>${o[2]}</span></button>`).join('')}</div><button class="fb" id="fbtn">نمایش فرمول محاسبه شارژ</button>`;m.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{v[st.k]=b.dataset.v;render()});$('fbtn').onclick=formulaInfo;}else setTimeout(()=>inp.focus(),50);
  }else if(s===steps.length){
    m.innerHTML=`<div class="card hd"><h1>اطلاعات واحدها</h1><p>متراژ و تعداد ساکنین هر واحد. واحد خالی را ۰ بگذارید. این اطلاعات روی گوشی ذخیره می‌شود.</p>
    <div class="sum"><div><b id="sN">۰</b><span>واحد</span></div><div><b id="sA">۰</b><span>متراژ کل</span></div><div><b id="sP">۰</b><span>ساکن کل</span></div></div>
    <div class="lbl">پر کردن سریع برای همه واحدها</div>
    <div class="row2"><input class="mid" id="fa" inputmode="decimal" placeholder="متراژ"><input class="mid" id="fp" inputmode="numeric" placeholder="تعداد ساکن"></div>
    <button class="b3" id="fill">اعمال روی همه واحدها</button>
    <details><summary>وارد کردن یکجا (کپی از اکسل)</summary><p style="font-size:15px">هر خط یک واحد: متراژ، فاصله یا ویرگول، تعداد ساکن</p><textarea id="paste" placeholder="85 3&#10;100 4&#10;70 0"></textarea><button class="b3" id="imp">وارد کردن</button></details></div>
    <div class="card"><div class="urow"><div></div><div class="lbl">متراژ</div><div class="lbl">ساکن</div></div>
    ${units.map((u,i)=>`<div class="urow"><div class="n">${ulabel(u,i)}</div><input class="sm" data-i="${i}" data-f="a" inputmode="decimal" value="${u.a?norm(u.a):''}" placeholder="۰"><input class="sm" data-i="${i}" data-f="p" inputmode="numeric" value="${u.p?u.p:''}" placeholder="۰"></div>`).join('')}</div><div class="err" id="err"></div>`;
    const upd=()=>{$('sN').textContent=fa(units.length);$('sA').textContent=fa(units.reduce((x,u)=>x+u.a,0));$('sP').textContent=fa(units.reduce((x,u)=>x+u.p,0))};
    upd();
    m.querySelectorAll('.sm').forEach(e=>e.oninput=()=>{const u=units[e.dataset.i];u[e.dataset.f]=e.dataset.f==='p'?Math.floor(num(e.value)):num(e.value);save();upd()});
    $('fill').onclick=()=>{const a=num($('fa').value),p=Math.floor(num($('fp').value));units.forEach(u=>{if(a)u.a=a;if($('fp').value!=='')u.p=p});save();render()};
    $('imp').onclick=()=>{const L=norm0($('paste').value);L.forEach((r,i)=>{if(i<units.length){units[i].a=r[0];units[i].p=r[1]}});save();render()};
  }else{
    const c=calc();
    if(c.err){m.innerHTML=`<div class="card"><h1>خطا</h1><p>${c.err}</p></div>`;}
    else{
      m.innerHTML=`<div class="card total"><p>جمع کل شارژ این ماه</p><div class="v">${fa(c.target)}</div><div class="unit-lbl">تومان</div><div class="ok" style="margin-top:8px">جمع پرداختی‌ها دقیقاً برابر هزینه‌هاست ✓</div></div>
      <div class="card"><div class="kv"><span>هزینه‌های جاری</span><b>${fa(c.O)}</b></div><div class="kv"><span>سهم صندوق</span><b>${fa(c.R)}</b></div><div class="kv"><span>تعداد واحد / ساکن</span><b>${fa(c.n)} / ${fa(c.N)}</b></div><div class="kv"><span>متراژ کل</span><b>${fa(c.A)}</b></div></div>
      <div class="card"><h1 style="font-size:22px">جستجوی واحد</h1><input class="mid" id="q" inputmode="numeric" placeholder="شماره واحد (مثلاً ۲۰۱)"><div id="qr"></div></div>
      <div class="card"><h1 style="font-size:22px">همه واحدها</h1><div class="list">${c.rows.map(r=>`<div class="lrow"><span style="display:flex;align-items:center;gap:10px"><button class="ib" data-i="${r.i}" aria-label="info">i</button><span>${uname(r.i)} <small style="color:var(--mut)">(${fa(units[r.i].a)}م، ${fa(units[r.i].p)}نفر)</small></span></span><b>${fa(r.pay)}</b></div>`).join('')}</div><button class="b3" id="cp">کپی فهرست</button></div>`;
      m.querySelectorAll('.ib').forEach(b=>b.onclick=()=>info(c,+b.dataset.i));
      $('q').oninput=()=>{const t=norm($('q').value);const hits=t?c.rows.filter(r=>{const l=units[r.i].l||String(r.i+1);return l===t||l.startsWith(t)}).slice(0,8):[];$('qr').innerHTML=hits.map(r=>`<div class="lrow"><span style="display:flex;align-items:center;gap:10px"><button class="ib" data-i="${r.i}">i</button><span>${uname(r.i)}</span></span><b>${fa(r.pay)}</b></div>`).join('');$('qr').querySelectorAll('.ib').forEach(b=>b.onclick=()=>info(c,+b.dataset.i))};
      $('cp').onclick=()=>{const t=c.rows.map(r=>`واحد ${r.i+1}: ${r.pay}`).join('\n');try{navigator.clipboard.writeText(t);$('cp').textContent='کپی شد ✓'}catch(e){$('cp').textContent='کپی ممکن نشد'}};
    }
  }
  nav.innerHTML=(s>0?'<button class="b2" id="bk">قبلی</button>':'')+(s<last?`<button class="b1" id="nx">${s===steps.length?'محاسبه شارژ':'بعدی'}</button>`:'<button class="b1" id="rs">شروع ماه جدید</button>');
  if($('bk'))$('bk').onclick=()=>{s--;render();scrollTo(0,0)};
  if($('nx'))$('nx').onclick=()=>{
    if(s<steps.length&&steps[s].k==='n'){if(v.n<1){$('err').textContent='تعداد واحدها را وارد کنید.';return}setCount(v.n)}
    if(s===steps.length){const A=units.reduce((x,u)=>x+u.a,0),N=units.reduce((x,u)=>x+u.p,0);
      if(A<=0){$('err').textContent='متراژ واحدها را وارد کنید.';return}
      if(v.W>0&&N<=0){$('err').textContent='آب وارد شده ولی ساکنی ثبت نشده.';return}}
    s++;render();scrollTo(0,0)};
  if($('rs'))$('rs').onclick=()=>{Object.assign(v,DEFV,{n:units.length});s=0;render();scrollTo(0,0)};
}
function info(c,i){
 const r=c.rows[i],u=units[i],W=c.N>0?v.W:0,adj=i===c.big?c.adj:0;
 const fn=x=>x.toLocaleString('fa-IR',{maximumFractionDigits:2});
 const item=(t,f,val,x)=>`<div class="mi"><div class="mh"><b>${t}</b><b>${fa(val)}</b></div><div class="mf">${f}</div><div class="mx">${x}</div></div>`;
 const eq=v.em==='u';
 const h=`<div class="mbox"><div class="mt"><h1 style="margin:0">${uname(i)}</h1><button class="mc" id="mclose">×</button></div>
 <p>متراژ <b>${fn(u.a)}</b> متر · ساکنین <b>${fa(u.p)}</b> نفر${u.p?'':' (خالی)'}</p>
 ${item('پرسنل',`${fa(v.P)} ÷ ${fa(c.n)} واحد`,r.c,'هزینه‌ی پرسنل بین همه‌ی واحدها مساوی تقسیم می‌شود، حتی واحد خالی.')}
 ${item('برق مشاع',eq?`${fa(v.E)} ÷ ${fa(c.n)} واحد`:`${fn(u.a)} متر × (${fa(v.E)} ÷ ${fn(c.A)} متر)`,r.e,eq?'برق مشاع بین همه‌ی واحدها مساوی تقسیم می‌شود، حتی واحد خالی.':'برق مشاع بر اساس متراژ تقسیم می‌شود. واحد خالی هم می‌پردازد.')}
 ${item('آب',`${fa(u.p)} نفر × (${fa(W)} ÷ ${fa(c.N)} نفر)`,r.w,'فقط بین ساکنین تقسیم می‌شود. هر نفر سهم یکسان دارد و واحد خالی آب نمی‌دهد.')}
 ${item('گاز',`${fn(u.a)} متر × (${fa(v.G)} ÷ ${fn(c.A)} متر)`,r.g,'بر اساس متراژ تقسیم می‌شود. واحد خالی هم می‌پردازد.')}
 ${item('نگهداری و تعمیرات',`${fn(u.a)} متر × (${fa(v.M)} ÷ ${fn(c.A)} متر)`,r.m,'هزینه‌ی نگهداری جاری بر اساس متراژ تقسیم می‌شود.')}
 ${item('صندوق',`${fn(u.a)} متر × (${fa(c.R)} ÷ ${fn(c.A)} متر)`,r.f,`صندوق می‌شود ${v.r.toLocaleString('fa-IR')}٪ از کل هزینه‌های جاری (${fa(c.O)} تومان) = ${fa(c.R)} تومان، که بر اساس متراژ تقسیم می‌شود.`)}
 <div class="mi"><div class="mh"><span>جمع دقیق همه‌ی سهم‌ها</span><b>${fa(r.raw)}</b></div><div class="mx">جزء‌ها جدا گرد نمی‌شوند؛ اول جمع دقیق حساب می‌شود و بعد تا تومان گرد می‌شود. به همین خاطر جمع اعداد بالا ممکن است یک‌دو تومان با مبلغ نهایی فرق داشته باشد.</div></div>
 ${adj?`<div class="mi"><div class="mh"><span>تعدیل رند</span><b>${adj>0?'+':'−'}${fa(Math.abs(adj))}</b></div><div class="mx">اختلاف جمع رندشده‌ها با جمع هزینه‌ها روی واحد با بیشترین متراژ می‌نشیند تا جمع پرداختی‌ها دقیقاً برابر هزینه‌ها شود. این واحد بزرگ‌ترین متراژ را دارد.</div></div>`:''}
 <div class="total" style="margin-top:14px"><p style="margin:0">شارژ نهایی</p><div class="v">${fa(r.pay)}</div><div class="unit-lbl">تومان</div></div></div>`;
 const ov=document.createElement('div');ov.className='ov';ov.innerHTML=h;document.body.appendChild(ov);
 document.body.style.overflow='hidden';
 const close=()=>{ov.remove();document.body.style.overflow='';document.removeEventListener('keydown',esc)};
 const esc=e=>{if(e.key==='Escape')close()};
 document.addEventListener('keydown',esc);
 ov.onclick=e=>{if(e.target===ov)close()};
 ov.querySelector('#mclose').onclick=close;
}
function formulaInfo(){
 const row=(t,x)=>`<div class="mi"><b style="font-size:20px">${t}</b><div style="font-size:17px;color:var(--mut)">${x}</div></div>`;
 const h=`<div class="mbox"><div class="mt"><h1 style="margin:0">فرمول محاسبه شارژ</h1><button class="mc" id="mclose">×</button></div>

 <div class="mi"><b style="font-size:20px">یک مثال</b><div style="font-size:17px;color:var(--mut)">اگر متراژ ساختمان ۱۰٬۰۰۰ متر و قبض گاز ۱۰۰ میلیون باشد، واحد ۱۰۰ متری ۱٪ آن را می‌دهد: یک میلیون تومان.</div></div>

 const ov=document.createElement('div');ov.className='ov';ov.innerHTML=h;document.body.appendChild(ov);
 document.body.style.overflow='hidden';

 const esc=e=>{if(e.key==='Escape')close()};
 document.addEventListener('keydown',esc);
 ov.onclick=e=>{if(e.target===ov)close()};
 ov.querySelector('#mclose').onclick=close;
}
function norm0(t){return t.split('\n').map(l=>norm(l.replace(/[,\t،]/g,' ').trim().replace(/\s+/g,'|')).split('|').map(x=>parseFloat(x)||0)).filter(r=>r.length>=1&&(r[0]||r[1])).map(r=>[r[0]||0,Math.floor(r[1]||0)])}
render();
